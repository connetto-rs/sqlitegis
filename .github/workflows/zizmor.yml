---
name: zizmor

"on":
  pull_request:
    paths:
      - .github/**
  push:
    branches:
      - main
    paths:
      - .github/**
  schedule:
    - cron: "0 4 * * 1"

permissions: {}

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The findings go to code scanning, whose pull request check flags the alerts a
# change introduces, since the older workflows still carry findings of their own.
jobs:
  zizmor:
    name: Audit the workflows and actions
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.30.1
